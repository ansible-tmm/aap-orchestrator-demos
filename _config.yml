title: Automation orchestrator demos
description: Hands-on automation orchestrator demo workflows and use cases
url: https://ansible-tmm.github.io
baseurl: /aap-orchestrator-demos
repository: ansible-tmm/aap-orchestrator-demos

markdown: kramdown
theme: null

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .github/
  - sean_old_ignore/
  - cert-lifecycle/
  - cert-expiry-switch/
  - risk-based-routing/
  - proactive-assessment/
  - event-driven-xsos-rca/
  - ai-incident-triage/
  - multi-service-correlation/
  - disk-utilization/
  - ticket-enrichment/
  - cve-remediation/
  - service-health/
  - patch-management/
  - multi-os-cloud-patching/
  - user-lifecycle/
  - backup-management/
  - subscription-management/
  - kernel-compliance/
  - collections/
  - shared/
  - README.md
  - DEVELOPER.md
  - .gitignore
  - .cursor/

defaults:
  - scope:
      path: ""
    values:
      layout: default
