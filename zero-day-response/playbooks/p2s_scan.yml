---
# KNOW: evidence from every PHP asset, then deterministic classification. Unreachable => unknown (never clear).
- import_playbook: p2s_inventory.yml

- name: Collect evidence
  hosts: php2shell
  gather_facts: false
  become: true
  ignore_unreachable: true
  pre_tasks:
    - name: Explain unavailable project revision
      ansible.builtin.debug:
        msg: "p2s_commit is unknown because neither awx_project_revision nor tower_project_revision was supplied by AAP"
      when: awx_project_revision is not defined and tower_project_revision is not defined
      run_once: true
  tasks:
    - ansible.builtin.include_role: {name: p2s_response, tasks_from: scan}

- name: Classify and publish
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.include_role: {name: p2s_response, tasks_from: classify}
  post_tasks:
    - ansible.builtin.set_stats:
        per_host: false
        aggregate: false
        data:
          p2s_commit: "{{ awx_project_revision | default(tower_project_revision | default('unknown')) }}"
      run_once: true
