---
- name: Validate the AI answer
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Record AI input and runtime types
      ansible.builtin.debug:
        msg:
          raw_type: "{{ p2s_ai_raw | type_debug }}"
          p2s_ai_schema: "{{ p2s_ai_schema }}"
          ansible_version: "{{ ansible_version.full }}"
          ansible_playbook_python: "{{ ansible_playbook_python }}"
    - name: Check the reviewed AI schema
      ansible.builtin.import_role:
        name: p2s_response
        tasks_from: ai_check
