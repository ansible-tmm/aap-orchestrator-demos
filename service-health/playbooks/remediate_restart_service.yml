---
- name: Restart failed service
  hosts: "{{ _host | default('all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        service_name: "{{ service_name | default('httpd') }}"
        service_state: "{{ service_state | default('failed') }}"

    - name: Capture recent journal errors
      ansible.builtin.command:
        cmd: journalctl -u {{ service_name }} --no-pager -n 20 --output=short
      register: _journal_errors
      changed_when: false
      check_mode: false

    - name: Show recent journal entries
      ansible.builtin.debug:
        msg: "{{ _journal_errors.stdout_lines }}"

    - name: Reset failed state before restart
      ansible.builtin.command:
        cmd: systemctl reset-failed {{ service_name }}
      changed_when: true
      when: not ansible_check_mode

    - name: Preview restart (check mode)
      ansible.builtin.debug:
        msg: "[check mode] Would restart {{ service_name }} on {{ inventory_hostname }}."
      when: ansible_check_mode

    - name: Restart the service
      ansible.builtin.systemd:
        name: "{{ service_name }}"
        state: restarted
      register: _restart_result
      when: not ansible_check_mode

    - name: Wait for service to stabilize
      ansible.builtin.pause:
        seconds: 3
      when: not ansible_check_mode

    - name: Verify service is running after restart
      ansible.builtin.service_facts:
      when: not ansible_check_mode

    - name: Resolve post-restart state
      ansible.builtin.set_fact:
        service_state_after: >-
          {%- set svc = ansible_facts.services.get(service_name ~ '.service', {}) -%}
          {%- if svc.state | default('') == 'running' -%}active{%- else -%}{{ svc.state | default('unknown') }}{%- endif -%}
      when: not ansible_check_mode

    - name: Log restart result
      ansible.builtin.debug:
        msg: >-
          {{ service_name }} on {{ inventory_hostname }}:
          {{ service_state }} → {{ service_state_after | default('pending') }}

    - name: Publish artifacts for downstream steps
      ansible.builtin.set_stats:
        data:
          remediation_action: "Restart Service"
          service_name: "{{ service_name }}"
          service_state_before: "{{ service_state }}"
          service_state_after: "{{ service_state_after | default('pending') }}"
          journal_tail: "{{ _journal_errors.stdout_lines[-5:] | join(' | ') }}"
          notify_host: "{{ ansible_play_hosts | join(',') }}"
        per_host: false
        aggregate: false
      run_once: true
