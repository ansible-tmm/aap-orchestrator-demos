---
- name: Check certificate expiry
  hosts: "{{ _host | default('all') }}"
  become: true
  gather_facts: false
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        cert_path: "{{ cert_path | default('/etc/pki/tls/certs/server.crt') }}"
        cert_domain: "{{ cert_domain | default(inventory_hostname) }}"
        healthy_days: "{{ healthy_days | default(60) | int }}"
        plan_days: "{{ plan_days | default(30) | int }}"
        renew_days: "{{ renew_days | default(7) | int }}"
        _test_cert_status: "{{ test_cert_status | default('') | string | trim }}"
        _test_days_remaining: "{{ test_days_remaining | default('') | string | trim }}"

    - name: Use test cert status (skip live check)
      ansible.builtin.set_fact:
        cert_status: "{{ _test_cert_status }}"
        days_remaining: "{{ _test_days_remaining | default(0) | int }}"
        cert_expiry_date: "N/A"
      when: _test_cert_status | length > 0

    - name: Check if certificate file exists
      ansible.builtin.stat:
        path: "{{ cert_path }}"
      register: _cert_file
      when: _test_cert_status | length == 0

    - name: Fail when certificate not found
      ansible.builtin.fail:
        msg: "Certificate {{ cert_path }} not found on {{ inventory_hostname }}."
      when:
        - _test_cert_status | length == 0
        - not (_cert_file.stat.exists | default(false))

    - name: Get certificate expiry date
      ansible.builtin.shell:
        cmd: openssl x509 -in {{ cert_path }} -noout -enddate | cut -d= -f2
      register: _cert_enddate
      changed_when: false
      when: _test_cert_status | length == 0

    - name: Calculate days remaining
      ansible.builtin.shell:
        cmd: |
          expiry_epoch=$(date -d "{{ _cert_enddate.stdout }}" +%s 2>/dev/null || date -j -f "%b %d %T %Y %Z" "{{ _cert_enddate.stdout }}" +%s 2>/dev/null)
          now_epoch=$(date +%s)
          echo $(( (expiry_epoch - now_epoch) / 86400 ))
      register: _days_calc
      changed_when: false
      when: _test_cert_status | length == 0

    - name: Classify cert status from days remaining
      ansible.builtin.set_fact:
        days_remaining: "{{ _days_calc.stdout | int }}"
        cert_expiry_date: "{{ _cert_enddate.stdout }}"
        cert_status: >-
          {%- set d = _days_calc.stdout | int -%}
          {%- if d > (healthy_days | int) -%}
          healthy
          {%- elif d > (plan_days | int) -%}
          plan
          {%- elif d > (renew_days | int) -%}
          renew
          {%- else -%}
          emergency
          {%- endif -%}
      when: _test_cert_status | length == 0

    - name: Publish check artifacts for AO switch
      ansible.builtin.set_stats:
        data:
          cert_status: "{{ cert_status | trim }}"
          days_remaining: "{{ days_remaining | int }}"
          cert_expiry_date: "{{ cert_expiry_date | default('unknown') }}"
          cert_path: "{{ cert_path }}"
          cert_domain: "{{ cert_domain }}"
          notify_host: "{{ ansible_play_hosts | join(',') }}"
        per_host: false
        aggregate: false
      run_once: true

    - name: Show detected cert status
      ansible.builtin.debug:
        msg: >-
          {%- if _test_cert_status | length > 0 -%}
          [TEST] Simulated cert_status={{ cert_status }}, days_remaining={{ days_remaining }}
          {%- else -%}
          {{ cert_path }} on {{ inventory_hostname }} expires {{ cert_expiry_date }}
          ({{ days_remaining }} days) → cert_status={{ cert_status }}
          {%- endif -%}
