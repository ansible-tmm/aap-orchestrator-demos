---
- name: Emergency certificate renewal — expiry imminent
  hosts: "{{ _host | default('all') }}"
  become: true
  gather_facts: true
  vars:
    tmp_prefix: "/tmp/emergency-cert-{{ ansible_date_time.epoch }}"
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        cert_status: "{{ cert_status | default('emergency') }}"
        cert_path: "{{ cert_path | default('/etc/pki/tls/certs/server.crt') }}"
        cert_key_path: "{{ cert_key_path | default('/etc/pki/tls/private/server.key') }}"
        cert_domain: "{{ cert_domain | default(inventory_hostname) }}"
        cert_valid_days: "{{ cert_valid_days | default(365) | int }}"
        cert_key_size: "{{ cert_key_size | default(2048) | int }}"
        days_remaining: "{{ days_remaining | default(0) | int }}"

    - name: Log emergency renewal
      ansible.builtin.debug:
        msg: >-
          EMERGENCY: {{ cert_domain }} on {{ inventory_hostname }} expires in
          {{ days_remaining }} days. Initiating immediate renewal.

    - name: Backup current certificate
      ansible.builtin.copy:
        src: "{{ cert_path }}"
        dest: "{{ cert_path }}.emergency-backup"
        remote_src: true
        mode: '0600'
      ignore_errors: true

    - name: Backup current key
      ansible.builtin.copy:
        src: "{{ cert_key_path }}"
        dest: "{{ cert_key_path }}.emergency-backup"
        remote_src: true
        mode: '0600'
      ignore_errors: true

    - name: Preview emergency renewal (check mode)
      ansible.builtin.debug:
        msg: >-
          [check mode] Would perform emergency renewal for {{ cert_domain }}.
          Certificate expires in {{ days_remaining }} days.
      when: ansible_check_mode

    - name: Generate new private key
      community.crypto.openssl_privatekey:
        path: "{{ cert_key_path }}"
        size: "{{ cert_key_size }}"
        type: RSA
        mode: '0600'
        force: true
      when: not ansible_check_mode

    - name: Generate CSR
      community.crypto.openssl_csr:
        path: "{{ tmp_prefix }}.csr"
        privatekey_path: "{{ cert_key_path }}"
        common_name: "{{ cert_domain }}"
        subject_alt_name:
          - "DNS:{{ cert_domain }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth
        force: true
      when: not ansible_check_mode

    - name: Generate self-signed certificate
      community.crypto.x509_certificate:
        path: "{{ cert_path }}"
        privatekey_path: "{{ cert_key_path }}"
        csr_path: "{{ tmp_prefix }}.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ cert_valid_days }}d"
        force: true
      when: not ansible_check_mode

    - name: Clean up temp CSR
      ansible.builtin.file:
        path: "{{ tmp_prefix }}.csr"
        state: absent

    - name: Get new certificate info
      ansible.builtin.shell:
        cmd: openssl x509 -in {{ cert_path }} -noout -dates -subject
      register: _new_cert_info
      changed_when: false
      when: not ansible_check_mode

    - name: Log emergency renewal result
      ansible.builtin.debug:
        msg: >-
          EMERGENCY renewal complete for {{ cert_domain }} on {{ inventory_hostname }}.
          {{ _new_cert_info.stdout | default('[check mode]') }}

    - name: Publish emergency artifacts for downstream steps
      ansible.builtin.set_stats:
        data:
          remediation_action: "Emergency Renew"
          cert_status: "renewed"
          cert_domain: "{{ cert_domain }}"
          cert_valid_days: "{{ cert_valid_days }}"
          days_remaining_before: "{{ days_remaining }}"
          urgency: "emergency"
          dry_run: "{{ ansible_check_mode }}"
          notify_host: "{{ ansible_play_hosts | join(',') }}"
        per_host: false
        aggregate: false
      run_once: true
