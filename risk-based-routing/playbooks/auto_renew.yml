---
- name: Auto-renew low-risk certificate
  hosts: "{{ _host | default('webservers') }}"
  become: true
  gather_facts: true
  vars:
    tmp_prefix: "/tmp/auto-renew-{{ ansible_date_time.epoch }}"

  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        cert_domain: "{{ cert_domain | default(ansible_fqdn) }}"
        cert_dir: "{{ cert_dir | default('/etc/pki/tls/certs') }}"
        cert_key_dir: "{{ cert_key_dir | default('/etc/pki/tls/private') }}"
        cert_valid_days: "{{ cert_valid_days | default(365) | int }}"
        risk_tier: "{{ risk_tier | default('low') }}"

    - name: Backup current certificate
      ansible.builtin.copy:
        src: "{{ cert_dir }}/{{ cert_domain }}.crt"
        dest: "{{ cert_dir }}/{{ cert_domain }}.crt.backup"
        remote_src: true
        mode: '0600'
      ignore_errors: true

    - name: Generate new private key
      community.crypto.openssl_privatekey:
        path: "{{ cert_key_dir }}/{{ cert_domain }}.key"
        size: 4096
        type: RSA
        mode: '0600'
        force: true
      when: not ansible_check_mode

    - name: Generate CSR
      community.crypto.openssl_csr:
        path: "{{ tmp_prefix }}.csr"
        privatekey_path: "{{ cert_key_dir }}/{{ cert_domain }}.key"
        common_name: "{{ cert_domain }}"
        subject_alt_name:
          - "DNS:{{ cert_domain }}"
        key_usage:
          - digitalSignature
          - keyEncipherment
        extended_key_usage:
          - serverAuth
        force: true
      when: not ansible_check_mode

    - name: Sign certificate (self-signed for demo)
      community.crypto.x509_certificate:
        path: "{{ cert_dir }}/{{ cert_domain }}.crt"
        privatekey_path: "{{ cert_key_dir }}/{{ cert_domain }}.key"
        csr_path: "{{ tmp_prefix }}.csr"
        provider: selfsigned
        selfsigned_not_after: "+{{ cert_valid_days }}d"
        force: true
      when: not ansible_check_mode

    - name: Clean up temp files
      ansible.builtin.file:
        path: "{{ tmp_prefix }}.csr"
        state: absent

    - name: Preview auto-renewal (check mode)
      ansible.builtin.debug:
        msg: >-
          [check mode] Would auto-renew {{ cert_domain }} certificate
          for {{ cert_valid_days }} days on {{ inventory_hostname }}.
      when: ansible_check_mode

    - name: Get new certificate info
      ansible.builtin.shell: |
        openssl x509 -in {{ cert_dir }}/{{ cert_domain }}.crt -noout -dates -subject
      register: new_cert_info
      changed_when: false
      when: not ansible_check_mode

    - name: Log auto-renewal result
      ansible.builtin.debug:
        msg: >-
          Auto-renewed {{ cert_domain }} on {{ inventory_hostname }}.
          {{ new_cert_info.stdout | default('check mode') }}.

    - name: Publish renewal artifacts
      ansible.builtin.set_stats:
        data:
          cert_renewal_status: "success"
          cert_domain: "{{ cert_domain }}"
          risk_tier: "{{ risk_tier }}"
          renewal_type: "auto_renew"
          cert_valid_days: "{{ cert_valid_days }}"
          notify_host: "{{ ansible_play_hosts | join(',') }}"
        per_host: false
        aggregate: false
      run_once: true
