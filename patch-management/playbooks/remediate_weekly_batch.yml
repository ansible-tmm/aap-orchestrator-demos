---
- name: Weekly batch — queue moderate patches for next maintenance window
  hosts: "{{ _host | default('all') }}"
  become: true
  gather_facts: true
  tasks:
    - name: Apply defaults
      ansible.builtin.set_fact:
        highest_severity: "{{ highest_severity | default('moderate') }}"
        advisory_count_moderate: "{{ advisory_count_moderate | default(0) | int }}"
        batch_log_dir: "{{ batch_log_dir | default('/var/log/patch-batch') }}"

    - name: Ensure batch log directory exists
      ansible.builtin.file:
        path: "{{ batch_log_dir }}"
        state: directory
        mode: '0755'

    - name: List pending moderate advisories
      ansible.builtin.command:
        cmd: dnf updateinfo list --sec-severity=Moderate
      register: _advisory_list
      changed_when: false
      check_mode: false

    - name: Write batch manifest
      ansible.builtin.copy:
        content: |
          # Patch batch manifest — {{ inventory_hostname }}
          # Generated by AO patch-management workflow
          # Severity: moderate
          # Advisory count: {{ advisory_count_moderate }}
          {{ _advisory_list.stdout }}
        dest: "{{ batch_log_dir }}/batch-{{ ansible_date_time.date }}.txt"
        mode: '0644'
      when: not ansible_check_mode

    - name: Log batch queued
      ansible.builtin.debug:
        msg: >-
          {{ advisory_count_moderate }} moderate advisories on {{ inventory_hostname }}
          queued for weekly batch. Manifest written to
          {{ batch_log_dir }}/batch-{{ ansible_date_time.date }}.txt.

    - name: Publish artifacts for downstream steps
      ansible.builtin.set_stats:
        data:
          remediation_action: "Weekly Batch"
          highest_severity: "{{ highest_severity }}"
          advisory_count: "{{ advisory_count_moderate }}"
          batch_manifest: "{{ batch_log_dir }}/batch-{{ ansible_date_time.date }}.txt"
          notify_host: "{{ ansible_play_hosts | join(',') }}"
        per_host: false
        aggregate: false
      run_once: true
