event-driven-xsos-rca:
  status: active
  items:
    - name: setup_sqs_queue.yml
      path: event-driven-xsos-rca/playbooks/setup_sqs_queue.yml
      description: Creates the AWS SQS queue for unknown-issue RCA events (one-time per account/region).
      runs_on: localhost (AWS API)
    - name: publish_unknown_issue_event.yml
      path: event-driven-xsos-rca/playbooks/publish_unknown_issue_event.yml
      description: Publishes a demo unknown-issue JSON payload to SQS to simulate an alert integration.
      runs_on: localhost (AWS CLI)
    - name: post_ao_webhook.yml
      path: event-driven-xsos-rca/playbooks/post_ao_webhook.yml
      description: POSTs the SQS event payload to the automation orchestrator EDA webhook (launched by the EDA rulebook).
      runs_on: localhost
    - name: run_xsos_analysis.yml
      path: event-driven-xsos-rca/playbooks/run_xsos_analysis.yml
      description: Installs xSOS if needed, runs analysis on the target host, saves the report, and publishes RCA artifacts.
      runs_on: RHEL target host (EDA or manual)

ai-incident-triage:
  status: under-development

ticket-enrichment:
  status: active
  items:
    - name: update_snow_ticket.yml
      path: ticket-enrichment/playbooks/update_snow_ticket.yml
      description: Looks up a ServiceNow incident by number, posts triage work notes, and updates ticket state. Adds close code and close notes when resolving (state 6).
      runs_on: localhost (ServiceNow API)
    - name: remediate_disk_cleanup.yml
      path: ticket-enrichment/playbooks/remediate_disk_cleanup.yml
      description: Clears app session storage, removes large log files and compressed archives, forces log rotation, cleans dnf cache, and publishes before/after disk stats as artifacts.
      runs_on: RHEL target host
    - name: remediate_process_cleanup.yml
      path: ticket-enrichment/playbooks/remediate_process_cleanup.yml
      description: Identifies and kills high-CPU processes above a configurable threshold, cleans up PID markers, and publishes before/after CPU stats as artifacts.
      runs_on: RHEL target host

