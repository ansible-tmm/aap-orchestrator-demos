---
# Drain the load balancer before a production deployment.
# Simulates real LB drain: stops accepting new connections to prod,
# waits for in-flight requests to complete, updates OpenFlake.
# Dev deployments skip this step entirely.

- name: Drain load balancer before production deployment
  hosts: all
  become: true
  gather_facts: false
  vars:
    app_name: "inventory-service"
    artifact_version: "0.0.0"
    change_request: ""
    drain_wait_seconds: 10
    prod_port: 80

  tasks:
    - name: Resolve OpenFlake connection
      ansible.builtin.include_tasks: tasks/openflake_resolve_vars.yml
      when: change_request | length > 0
      delegate_to: localhost
      become: false

    - name: Look up change request
      ansible.builtin.include_tasks: tasks/openflake_lookup_change.yml
      when: change_request | length > 0
      delegate_to: localhost
      become: false

    - name: Enable maintenance page on prod port
      ansible.builtin.copy:
        dest: "/opt/app-prod/maintenance.html"
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Maintenance</title></head>
          <body>
            <h1>{{ app_name }} - Scheduled Maintenance</h1>
            <p>Deploying version {{ artifact_version }}. Back shortly.</p>
          </body>
          </html>
        mode: "0644"

    - name: OpenFlake - LB drain started
      ansible.builtin.include_tasks: tasks/openflake_patch_change.yml
      vars:
        openflake_work_note_text: >-
          [AO CD Pipeline] Load balancer drain initiated for {{ app_name }}.
          Stopping new connections to production (port {{ prod_port }}).
          Waiting {{ drain_wait_seconds }}s for in-flight requests to complete
          before deploying {{ artifact_version }}.
      when:
        - change_request | length > 0
        - openflake_sys_id is defined
      delegate_to: localhost
      become: false

    - name: Drain - wait for in-flight requests to complete
      ansible.builtin.pause:
        seconds: "{{ drain_wait_seconds }}"
        prompt: "Draining load balancer - waiting {{ drain_wait_seconds }}s for in-flight requests"

    - name: Confirm prod service is still reachable before handing off to deploy
      ansible.builtin.uri:
        url: "http://localhost:{{ prod_port }}/health"
        method: GET
        status_code: 200
      register: pre_deploy_check
      ignore_errors: true

    - name: Report drain status
      ansible.builtin.debug:
        msg:
          - "Load balancer drained for {{ app_name }}."
          - "Pre-deploy health check: {{ 'OK' if pre_deploy_check.status == 200 else 'UNREACHABLE (service may already be down)' }}"
          - "Handing off to production deployment of {{ artifact_version }}."

    - name: Set drain stats
      ansible.builtin.set_stats:
        data:
          ao_lb_drained: "true"
          ao_drain_summary: "LB drained for {{ app_name }}. Waited {{ drain_wait_seconds }}s. Ready for {{ artifact_version }} deployment."
