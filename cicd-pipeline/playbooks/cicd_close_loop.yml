---
# Close the change request in OpenFlake (ServiceNow-compatible Table API).
- name: Close OpenFlake change request and notify team
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_name: "inventory-service"
    artifact_version: "0.0.0"
    change_request: ""
    snow_close_note: "Deployment completed successfully. Change closed by automated pipeline."

  tasks:
    - name: Skip OpenFlake update if no change request provided
      ansible.builtin.debug:
        msg: "No change_request number provided - skipping OpenFlake update. Deployment of {{ app_name }} {{ artifact_version }} complete."
      when: change_request | length == 0

    - name: Resolve OpenFlake connection
      ansible.builtin.include_tasks: tasks/openflake_resolve_vars.yml
      when: change_request | length > 0

    - name: Look up change request
      ansible.builtin.include_tasks: tasks/openflake_lookup_change.yml
      when: change_request | length > 0

    - name: Add AI-generated close note and close the change request
      ansible.builtin.include_tasks: tasks/openflake_patch_change.yml
      vars:
        openflake_work_note_text: |-
          [CI/CD Demo - AO Pipeline]

          {{ snow_close_note }}
        # `| string` — OpenFlake Text columns reject numeric state values.
        openflake_patch_extra:
          state: "{{ '3' | string }}"
      when:
        - change_request | length > 0
        - openflake_sys_id is defined

    - name: Log result
      ansible.builtin.debug:
        msg: "Change request {{ change_request }} closed. URL: {{ openflake_url }}/changes/{{ openflake_sys_id | default('N/A') }}"
      when: change_request | length > 0

    - name: Set close loop stats
      ansible.builtin.set_stats:
        data:
          ao_change_closed: "true"
          ao_change_request: "{{ change_request }}"
