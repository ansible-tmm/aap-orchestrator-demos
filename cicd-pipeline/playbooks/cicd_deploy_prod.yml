---
- name: Snapshot current prod, deploy artifact to prod, and run smoke test
  hosts: all
  become: true
  gather_facts: false
  vars:
    _app_name: "inventory-service"
    _artifact_version: "0.0.0"
    _git_sha: "unknown"
    app_name: "{{ app_name_override | default(_app_name) }}"
    artifact_version: "{{ artifact_version_override | default(_artifact_version) }}"
    git_sha: "{{ git_sha_override | default(_git_sha) }}"
    ci_build_url: ""
    affected_cve: ""
    change_request: ""
    snow_instance_url: "https://ansible.service-now.com"
    snow_username: ""
    snow_password: ""
    prod_port: 80
    prod_app_dir: "/opt/app-prod"
    prod_service: "app-prod"
    snapshot_base: "/opt/app-snapshots"
    health_endpoint: "http://localhost:{{ prod_port }}/health"

  tasks:
    - name: Look up SNOW change request sys_id
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/change_request?sysparm_query=number={{ change_request }}&sysparm_fields=sys_id&sysparm_limit=1"
        method: GET
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Accept: application/json
        status_code: 200
      register: snow_lookup
      when: change_request | length > 0
      delegate_to: localhost
      become: false

    - name: Set SNOW sys_id fact
      ansible.builtin.set_fact:
        snow_sys_id: "{{ snow_lookup.json.result[0].sys_id }}"
      when:
        - change_request | length > 0
        - snow_lookup.json.result | length > 0

    - name: SNOW - Approval granted, production deployment starting
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/change_request/{{ snow_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          work_notes: "[AO CD Pipeline] Production deployment approved and starting for {{ app_name }} {{ artifact_version }}{% if affected_cve %} (remediates {{ affected_cve }}){% endif %}. Taking pre-deploy snapshot before rollout."
          state: "{{ '2' }}"
        status_code: 200
      when:
        - change_request | length > 0
        - snow_sys_id is defined
      delegate_to: localhost
      become: false

    - name: Ensure snapshot directory exists
      ansible.builtin.file:
        path: "{{ snapshot_base }}"
        state: directory
        mode: "0755"

    - name: Ensure prod app directory exists
      ansible.builtin.file:
        path: "{{ prod_app_dir }}"
        state: directory
        mode: "0755"

    - name: Generate snapshot ID
      ansible.builtin.set_fact:
        snapshot_id: "{{ app_name }}-{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%S') }}"

    - name: Snapshot current prod state before deploy
      ansible.builtin.command:
        cmd: "tar -czf {{ snapshot_base }}/{{ snapshot_id }}.tar.gz -C / opt/app-prod"
      changed_when: true
      ignore_errors: true

    - name: Write version manifest to prod
      ansible.builtin.copy:
        dest: "{{ prod_app_dir }}/version.txt"
        content: "{{ artifact_version }}"
        mode: "0644"

    - name: Write deployment metadata to prod
      ansible.builtin.copy:
        dest: "{{ prod_app_dir }}/deploy-info.txt"
        content: |
          app={{ app_name }}
          version={{ artifact_version }}
          sha={{ git_sha }}
          env=prod
          deployed={{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}
          change={{ change_request }}
          {% if affected_cve %}cve_remediated={{ affected_cve }}{% endif %}
        mode: "0644"

    - name: Write systemd unit for prod app (app.py)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ prod_service }}.service"
        content: |
          [Unit]
          Description={{ app_name }} production environment
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ prod_app_dir }}
          Environment=APP_NAME={{ app_name }}
          Environment=APP_ENV=prod
          Environment=APP_PORT={{ prod_port }}
          ExecStart=/usr/bin/python3 app.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
        mode: "0644"
      notify: Reload systemd

    - name: Flush handlers before starting service
      ansible.builtin.meta: flush_handlers

    - name: Restart prod app service
      ansible.builtin.systemd:
        name: "{{ prod_service }}"
        state: restarted
        enabled: true
        daemon_reload: true

    - name: Wait for prod service to respond
      ansible.builtin.uri:
        url: "{{ health_endpoint }}"
        method: GET
        status_code: 200
      register: smoke_check
      until: smoke_check.status == 200
      retries: 10
      delay: 3
      ignore_errors: true

    - name: Verify deployed version matches artifact
      ansible.builtin.uri:
        url: "http://localhost:{{ prod_port }}/version.txt"
        method: GET
        return_content: true
      register: version_response
      ignore_errors: true

    - name: Evaluate smoke test results
      ansible.builtin.set_fact:
        service_healthy: "{{ smoke_check.status is defined and smoke_check.status == 200 }}"
        version_correct: "{{ (artifact_version | regex_replace('-b.*$', '')) in (version_response.content | default('')) }}"

    - name: Set smoke test outcome stats
      ansible.builtin.set_stats:
        data:
          ao_prod_health_passed: "{{ 'true' if (service_healthy and version_correct) else 'false' }}"
          ao_snapshot_id: "{{ snapshot_id }}"
          ao_smoke_test_summary: >-
            {% if service_healthy and version_correct %}
            Smoke test passed: {{ app_name }} {{ artifact_version }} running on port {{ prod_port }}, health endpoint returned 200 OK, version manifest verified.{% if affected_cve %} CVE {{ affected_cve }} confirmed remediated.{% endif %}
            {% elif not service_healthy %}
            Smoke test FAILED: service did not respond on port {{ prod_port }} within expected timeout. Health endpoint check failed.
            {% else %}
            Smoke test FAILED: service is up on port {{ prod_port }} but version manifest does not match expected version {{ artifact_version }}.
            {% endif %}
          ao_failed_checks: >-
            {% if service_healthy and version_correct %}none{% else %}
            {% if not service_healthy %}health_endpoint_unreachable{% endif %}{% if not version_correct %} version_manifest_mismatch{% endif %}
            {% endif %}

    - name: SNOW - Production smoke test result
      ansible.builtin.uri:
        url: "{{ snow_instance_url }}/api/now/table/change_request/{{ snow_sys_id }}"
        method: PATCH
        user: "{{ snow_username }}"
        password: "{{ snow_password }}"
        force_basic_auth: true
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          work_notes: >-
            [AO CD Pipeline] Production smoke test
            {% if service_healthy and version_correct %}PASSED{% else %}FAILED{% endif %}
            for {{ app_name }} {{ artifact_version }}.
            {% if service_healthy and version_correct %}
            Health endpoint OK on port {{ prod_port }}, version verified.{% if affected_cve %} CVE {{ affected_cve }} confirmed remediated in production.{% endif %} Snapshot {{ snapshot_id }} retained for rollback if needed.
            {% else %}
            {% if not service_healthy %}Health endpoint unreachable on port {{ prod_port }}.{% endif %}
            {% if not version_correct %}Version manifest mismatch.{% endif %}
            Snapshot {{ snapshot_id }} available. Automated rollback will be triggered.
            {% endif %}
        status_code: 200
      when:
        - change_request | length > 0
        - snow_sys_id is defined
      delegate_to: localhost
      become: false

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
