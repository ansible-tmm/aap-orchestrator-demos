---
# Clear an OpenFlake change request back to a clean "New" demo state
# (empty work/close notes, open state) so the CI/CD Pipeline can be re-run.
- name: Reset OpenFlake change request for CI/CD demo
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Survey / extra_vars — default matches AO webhook mock + lab CHG.
    change_request: CHG0034907
    openflake_reset_short_description: APD CI/CD demo change (ready for pipeline)
    openflake_reset_description: >-
      Reset for AO CI/CD Pipeline demo. Work notes and close notes cleared.

  tasks:
    - name: Normalize change request digits
      when: >-
        (change_request | string | regex_search('^\\d+$'))
        or (change_request | string | regex_search('(?i)^CHG\\d+$'))
      ansible.builtin.set_fact:
        _chg_digits: "{{ change_request | string | regex_replace('(?i)^CHG', '') | regex_replace('[^0-9]', '') }}"

    - name: Normalize change request number
      ansible.builtin.set_fact:
        _chg_number: >-
          {{
            ('CHG' ~ ('%07d' | format(_chg_digits | int)))
            if (_chg_digits | default('') | length) > 0
            else (change_request | string | trim)
          }}

    - name: Show change request being reset
      ansible.builtin.debug:
        msg: "Resetting OpenFlake change request {{ _chg_number }}"

    - name: Resolve OpenFlake connection
      ansible.builtin.include_tasks: tasks/openflake_resolve_vars.yml

    - name: Look up change request (create if missing)
      ansible.builtin.include_tasks: tasks/openflake_lookup_change.yml
      vars:
        change_request: "{{ _chg_number }}"
        openflake_ensure_short_description: "{{ openflake_reset_short_description }}"

    - name: Clear notes and reopen change request
      ansible.builtin.uri:
        url: "{{ openflake_url }}{{ openflake_api_prefix }}/table/change_request/{{ openflake_sys_id }}"
        method: PATCH
        user: "{{ openflake_user }}"
        password: "{{ openflake_pass }}"
        force_basic_auth: true
        validate_certs: "{{ openflake_verify_certs | default(true) | bool }}"
        headers:
          Content-Type: application/json
          Accept: application/json
        body_format: json
        body:
          # OpenFlake "New" state (same as create).
          state: "{{ '-5' | string }}"
          work_notes: ""
          close_notes: ""
          close_code: ""
          short_description: "{{ openflake_reset_short_description }}"
          description: "{{ openflake_reset_description }}"
        status_code: [200]
      register: openflake_reset
      delegate_to: localhost
      become: false

    - name: Show reset result
      ansible.builtin.debug:
        msg:
          - "OpenFlake change {{ _chg_number }} reset to New."
          - "URL: {{ openflake_url }}/changes/{{ openflake_sys_id }}"
          - "Work notes and close notes cleared — ready for another AO pipeline run."
