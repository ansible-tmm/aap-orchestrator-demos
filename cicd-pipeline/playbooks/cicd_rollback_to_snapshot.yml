---
- name: Rollback prod to pre-deploy snapshot and update ServiceNow
  hosts: all
  become: true
  gather_facts: false
  vars:
    app_name: "inventory-service"
    artifact_version: "0.0.0"
    snapshot_id: ""
    change_request: "CHG0000000"
    snow_incident_note: "Automated rollback executed after smoke test failure."
    recommended_next_step: "Investigate failure and re-run CI pipeline."
    prod_port: 80
    prod_app_dir: "/opt/app-prod"
    prod_service: "app-prod"
    snapshot_base: "/opt/app-snapshots"

  tasks:
    - name: Verify snapshot file exists
      ansible.builtin.stat:
        path: "{{ snapshot_base }}/{{ snapshot_id }}.tar.gz"
      register: snapshot_stat

    - name: Fail if snapshot not found
      ansible.builtin.fail:
        msg: "Snapshot {{ snapshot_id }} not found at {{ snapshot_base }}. Cannot roll back."
      when: not snapshot_stat.stat.exists

    - name: Stop prod service before restore
      ansible.builtin.systemd:
        name: "{{ prod_service }}"
        state: stopped
      ignore_errors: true

    - name: Remove current prod app directory contents
      ansible.builtin.file:
        path: "{{ prod_app_dir }}"
        state: absent

    - name: Recreate prod app directory
      ansible.builtin.file:
        path: "{{ prod_app_dir }}"
        state: directory
        mode: "0755"

    - name: Restore prod from snapshot
      ansible.builtin.command:
        cmd: "tar -xzf {{ snapshot_base }}/{{ snapshot_id }}.tar.gz -C /"
      changed_when: true

    - name: Restart prod service after restore
      ansible.builtin.systemd:
        name: "{{ prod_service }}"
        state: restarted
        daemon_reload: true

    - name: Verify prod service is healthy after rollback
      ansible.builtin.uri:
        url: "http://localhost:{{ prod_port }}/health"
        method: GET
        status_code: 200
      register: post_rollback_check
      until: post_rollback_check.status == 200
      retries: 10
      delay: 3

    - name: Read restored version
      ansible.builtin.uri:
        url: "http://localhost:{{ prod_port }}/version.txt"
        method: GET
        return_content: true
      register: restored_version

    - name: Report rollback completion
      ansible.builtin.debug:
        msg:
          - "Rollback complete. Prod restored from snapshot: {{ snapshot_id }}"
          - "Running version: {{ restored_version.content | default('unknown') }}"
          - "ServiceNow note: {{ snow_incident_note }}"
          - "Recommended next step: {{ recommended_next_step }}"

    - name: Set rollback outcome stats
      ansible.builtin.set_stats:
        data:
          ao_rollback_complete: "true"
          ao_restored_snapshot: "{{ snapshot_id }}"
          ao_rollback_summary: "Prod rolled back to snapshot {{ snapshot_id }} after {{ artifact_version }} smoke test failure. Service confirmed healthy on port {{ prod_port }}. {{ recommended_next_step }}"
