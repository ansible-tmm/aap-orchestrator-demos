---
- name: Provision demo host for CI/CD pipeline demo (dev port 8080, prod port 80)
  hosts: all
  become: true
  gather_facts: true
  vars:
    app_name: "inventory-service"
    initial_version: "2.3.0-b40"
    prod_port: 80
    dev_port: 8080
    prod_app_dir: "/opt/app-prod"
    dev_app_dir: "/opt/app-dev"
    snapshot_base: "/opt/app-snapshots"

  tasks:
    - name: Install Python3 and git
      ansible.builtin.package:
        name:
          - python3
          - git
        state: present

    - name: Create app directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ prod_app_dir }}"
        - "{{ dev_app_dir }}"
        - "{{ snapshot_base }}"

    - name: Write initial version manifest for prod
      ansible.builtin.copy:
        dest: "{{ prod_app_dir }}/version.txt"
        content: "{{ initial_version }}"
        mode: "0644"

    - name: Write initial version manifest for dev
      ansible.builtin.copy:
        dest: "{{ dev_app_dir }}/version.txt"
        content: "{{ initial_version }}"
        mode: "0644"

    - name: Write app.py to prod and dev
      ansible.builtin.copy:
        dest: "{{ item }}/app.py"
        mode: "0755"
        content: |
          import http.server, json, os, pathlib
          APP_NAME = os.getenv("APP_NAME", "inventory-service")
          APP_VERSION = pathlib.Path(__file__).parent.joinpath("version.txt").read_text().strip()
          APP_ENV = os.getenv("APP_ENV", "dev")
          APP_PORT = int(os.getenv("APP_PORT", "8080"))
          class AppHandler(http.server.BaseHTTPRequestHandler):
              def log_message(self, fmt, *args): pass
              def _send(self, code, body, ct="application/json"):
                  enc = body.encode()
                  self.send_response(code)
                  self.send_header("Content-Type", ct)
                  self.send_header("Content-Length", len(enc))
                  self.end_headers()
                  self.wfile.write(enc)
              def do_GET(self):
                  if self.path == "/health":
                      self._send(200, json.dumps({"status":"ok","app":APP_NAME,"version":APP_VERSION,"env":APP_ENV}))
                  elif self.path == "/version.txt":
                      self._send(200, f"app={APP_NAME}\nversion={APP_VERSION}\nenv={APP_ENV}\n", "text/plain")
                  elif self.path == "/":
                      self._send(200, f"<h1>{APP_NAME}</h1><p>Version: {APP_VERSION}</p><p>Env: {APP_ENV}</p>", "text/html")
                  else:
                      self._send(404, json.dumps({"error":"not found"}))
          if __name__ == "__main__":
              http.server.HTTPServer(("0.0.0.0", APP_PORT), AppHandler).serve_forever()
      loop:
        - "{{ prod_app_dir }}"
        - "{{ dev_app_dir }}"

    - name: Install prod systemd service (app.py)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/app-prod.service"
        content: |
          [Unit]
          Description={{ app_name }} production environment
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ prod_app_dir }}
          Environment=APP_NAME={{ app_name }}
          Environment=APP_ENV=prod
          Environment=APP_PORT={{ prod_port }}
          ExecStart=/usr/bin/python3 app.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Install dev systemd service (app.py)
      ansible.builtin.copy:
        dest: "/etc/systemd/system/app-dev.service"
        content: |
          [Unit]
          Description={{ app_name }} dev environment
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ dev_app_dir }}
          Environment=APP_NAME={{ app_name }}
          Environment=APP_ENV=dev
          Environment=APP_PORT={{ dev_port }}
          ExecStart=/usr/bin/python3 app.py
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Reload systemd and start both services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - app-prod
        - app-dev

    - name: Open port 80 in firewalld (if running)
      ansible.posix.firewalld:
        port: "80/tcp"
        permanent: true
        immediate: true
        state: enabled
      ignore_errors: true

    - name: Open port 8080 in firewalld (if running)
      ansible.posix.firewalld:
        port: "8080/tcp"
        permanent: true
        immediate: true
        state: enabled
      ignore_errors: true

    - name: Verify prod service responds
      ansible.builtin.uri:
        url: "http://localhost:{{ prod_port }}/health"
        method: GET
        status_code: 200
      register: prod_health
      until: prod_health.status == 200
      retries: 10
      delay: 3

    - name: Verify dev service responds
      ansible.builtin.uri:
        url: "http://localhost:{{ dev_port }}/health"
        method: GET
        status_code: 200
      register: dev_health
      until: dev_health.status == 200
      retries: 10
      delay: 3

    - name: Take initial baseline snapshot
      ansible.builtin.command:
        cmd: "tar -czf {{ snapshot_base }}/{{ app_name }}-baseline.tar.gz -C / opt/app-prod"
      changed_when: true

    - name: Print demo host setup summary
      ansible.builtin.debug:
        msg:
          - "Demo host ready."
          - "Prod app: http://{{ ansible_host }}:{{ prod_port }}/ (version {{ initial_version }})"
          - "Dev app:  http://{{ ansible_host }}:{{ dev_port }}/ (version {{ initial_version }})"
          - "Baseline snapshot: {{ snapshot_base }}/{{ app_name }}-baseline.tar.gz"
          - "Next: configure AAP job templates pointing to the four cicd_*.yml playbooks."
